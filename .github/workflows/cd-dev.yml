# ============================================================
# CD — Deploy to DEV
# Déclenché sur push vers la branche "develop"
# ============================================================
name: "CD — Deploy to DEV"

on:
  push:
    branches:
      - develop
  # Déclenchement manuel possible
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Tag de l'image à déployer (ex: dev-abc1234)"
        required: false
        default: "dev-latest"

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  IMAGE_FRONTEND: village-frontend
  IMAGE_BACKEND: village-backend
  K8S_NAMESPACE: village-dev

jobs:
  # ──────────────────────────────────────────────────────────
  # Job 1 — Build & Push images vers GHCR
  # ──────────────────────────────────────────────────────────
  build-and-push:
    name: "Build & Push Docker Images"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      frontend_tag: ${{ steps.meta-frontend.outputs.tags }}
      backend_tag: ${{ steps.meta-backend.outputs.tags }}
      image_tag: dev-${{ github.sha }}

    steps:
      - name: "Checkout DevOps repository"
        uses: actions/checkout@v4

      - name: "Checkout Application source"
        uses: actions/checkout@v4
        with:
          repository: abdenourdjouder/village
          path: village-app

      - name: "Login to GitHub Container Registry"
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Setup Docker Buildx"
        uses: docker/setup-buildx-action@v3

      - name: "Extract metadata (frontend)"
        id: meta-frontend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_FRONTEND }}
          tags: |
            type=raw,value=dev-latest
            type=raw,value=dev-${{ github.sha }}

      - name: "Build & Push frontend image"
        uses: docker/build-push-action@v5
        with:
          context: village-app/frontend
          file: docker/frontend/Dockerfile
          push: true
          tags: ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "Extract metadata (backend)"
        id: meta-backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_BACKEND }}
          tags: |
            type=raw,value=dev-latest
            type=raw,value=dev-${{ github.sha }}

      - name: "Build & Push backend image"
        uses: docker/build-push-action@v5
        with:
          context: village-app/backend
          file: docker/backend/Dockerfile
          push: true
          tags: ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ──────────────────────────────────────────────────────────
  # Job 2 — Deploy to DEV Kubernetes
  # ──────────────────────────────────────────────────────────
  deploy-dev:
    name: "Deploy to DEV Kubernetes"
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: development
      url: http://village.dev.example.com
    permissions:
      contents: read

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4

      - name: "Install kubectl"
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.28.0"

      - name: "Configure kubectl (DEV cluster)"
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DEV }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: "Verify cluster connection"
        run: |
          kubectl cluster-info
          kubectl get nodes

      - name: "Create/update Namespace"
        run: kubectl apply -f k8s/namespace/dev-namespace.yaml

      - name: "Apply ServiceAccounts & RBAC"
        run: |
          kubectl apply -f k8s/security/serviceaccount.yaml
          kubectl apply -f k8s/security/rbac.yaml

      - name: "Apply ConfigMaps"
        run: |
          kubectl apply -f k8s/backend/configmap.yaml
          kubectl apply -f k8s/frontend/configmap.yaml

      - name: "Apply Secrets (from GitHub secrets)"
        env:
          DB_PASSWORD: ${{ secrets.DEV_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.DEV_JWT_SECRET }}
        run: |
          kubectl create secret generic backend-secret \
            --from-literal=DB_PASSWORD="${DB_PASSWORD}" \
            --from-literal=JWT_SECRET="${JWT_SECRET}" \
            --namespace=${{ env.K8S_NAMESPACE }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: "Apply Storage (PV/PVC/PostgreSQL)"
        run: |
          kubectl apply -f k8s/storage/pv.yaml
          kubectl apply -f k8s/storage/pvc.yaml

      - name: "Deploy Backend"
        run: |
          # Appliquer le déploiement
          kubectl apply -f k8s/backend/deployment.yaml
          kubectl apply -f k8s/backend/service.yaml
          
          # Mettre à jour l'image avec le nouveau tag
          kubectl set image deployment/village-backend \
            backend=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_BACKEND }}:dev-${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}

      - name: "Wait for Backend rollout"
        run: |
          kubectl rollout status deployment/village-backend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=300s

      - name: "Deploy Frontend"
        run: |
          kubectl apply -f k8s/frontend/deployment.yaml
          kubectl apply -f k8s/frontend/service.yaml
          
          # Mettre à jour l'image
          kubectl set image deployment/village-frontend \
            frontend=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_FRONTEND }}:dev-${{ github.sha }} \
            -n ${{ env.K8S_NAMESPACE }}

      - name: "Wait for Frontend rollout"
        run: |
          kubectl rollout status deployment/village-frontend \
            -n ${{ env.K8S_NAMESPACE }} \
            --timeout=300s

      - name: "Apply Ingress & NetworkPolicies"
        run: |
          kubectl apply -f k8s/ingress/ingress.yaml
          kubectl apply -f k8s/security/networkpolicy.yaml

      - name: "Apply HPA (if metrics-server is available)"
        run: |
          kubectl apply -f k8s/backend/hpa.yaml || echo "⚠️ HPA skipped (metrics-server may not be installed)"
          kubectl apply -f k8s/frontend/hpa.yaml || echo "⚠️ HPA skipped"

      - name: "Deployment summary"
        run: |
          echo "=== 🚀 DEV Deployment Summary ==="
          echo "Namespace: ${{ env.K8S_NAMESPACE }}"
          echo "Image tag: dev-${{ github.sha }}"
          echo ""
          kubectl get all -n ${{ env.K8S_NAMESPACE }}

      - name: "Rollback on failure"
        if: failure()
        run: |
          echo "❌ Deployment failed! Rolling back..."
          kubectl rollout undo deployment/village-backend -n ${{ env.K8S_NAMESPACE }} || true
          kubectl rollout undo deployment/village-frontend -n ${{ env.K8S_NAMESPACE }} || true
          echo "✅ Rollback completed"
