# ============================================================
# HorizontalPodAutoscaler — Backend Spring Boot (DEV)
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: village-backend-hpa
  namespace: village-dev
  labels:
    app: village-backend
    environment: dev
    project: village
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: village-backend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
