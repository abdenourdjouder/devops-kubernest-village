# ============================================================
# Deployment — Frontend Angular (DEV)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: village-frontend
  namespace: village-dev
  labels:
    app: village-frontend
    environment: dev
    project: village
  annotations:
    kubernetes.io/change-cause: "Initial deployment"
spec:
  replicas: 1
  # Stratégie de rolling update sans downtime
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: village-frontend
  template:
    metadata:
      labels:
        app: village-frontend
        environment: dev
        project: village
      annotations:
        prometheus.io/scrape: "false"
    spec:
      # ServiceAccount dédié (créé dans k8s/security/)
      serviceAccountName: village-frontend-sa
      # Empêcher l'exécution en root
      securityContext:
        runAsNonRoot: true
        runAsUser: 101   # nginx user
        fsGroup: 101
      containers:
        - name: frontend
          # Remplacer <username> par votre nom d'utilisateur GitHub
          image: ghcr.io/abdenourdjouder/village-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
              protocol: TCP
          # Variables d'environnement depuis ConfigMap
          envFrom:
            - configMapRef:
                name: frontend-config
          # Ressources CPU/Mémoire
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "128Mi"
          # Liveness Probe — le conteneur est-il vivant ?
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 15
            failureThreshold: 3
            successThreshold: 1
          # Readiness Probe — le conteneur est-il prêt ?
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 3
            successThreshold: 1
          # Sécurité du conteneur
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false  # Nginx écrit dans /tmp
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
      # Attendre 5s avant le prochain pod (rolling update)
      minReadySeconds: 5
