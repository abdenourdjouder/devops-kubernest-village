# ============================================================
# Ingress — Village Application (DEV)
# Routage HTTP vers frontend et backend
#
# Prérequis: nginx ingress controller installé
# Minikube: minikube addons enable ingress
# Kubernetes: kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.8.2/deploy/static/provider/cloud/deploy.yaml
# ============================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: village-ingress
  namespace: village-dev
  labels:
    app: village
    environment: dev
    project: village
  annotations:
    # Nginx Ingress Controller
    nginx.ingress.kubernetes.io/use-regex: "true"
    # Réécriture des URLs API (ex: /api/users → /users)
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # Taille max des requêtes (uploads)
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    # Timeouts
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    # CORS (si nécessaire)
    nginx.ingress.kubernetes.io/enable-cors: "true"
    nginx.ingress.kubernetes.io/cors-allow-origin: "*"
spec:
  ingressClassName: nginx
  rules:
    - host: village.local
      http:
        paths:
          # Backend API — /api/* → backend:8080/*
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: village-backend-svc
                port:
                  number: 8080
          # Frontend Angular — /* → frontend:80/*
          - path: /()(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: village-frontend-svc
                port:
                  number: 80
