# ============================================================
# ServiceAccounts — Village Application (DEV)
# Identité des pods dans le cluster Kubernetes
# ============================================================

# ServiceAccount pour le frontend Angular
apiVersion: v1
kind: ServiceAccount
metadata:
  name: village-frontend-sa
  namespace: village-dev
  labels:
    app: village-frontend
    project: village
  annotations:
    description: "ServiceAccount for Village Angular frontend"
automountServiceAccountToken: false

---
# ServiceAccount pour le backend Spring Boot
apiVersion: v1
kind: ServiceAccount
metadata:
  name: village-backend-sa
  namespace: village-dev
  labels:
    app: village-backend
    project: village
  annotations:
    description: "ServiceAccount for Village Spring Boot backend"
automountServiceAccountToken: false
